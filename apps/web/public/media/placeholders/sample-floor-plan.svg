<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Illustrative ground-floor plan</title>
  <desc id="description">A labelled sample floor plan with an entrance hall, living room, kitchen and dining room, study, utility room and garden terrace.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d8d1c5" stroke-width="1" opacity=".38"/>
    </pattern>
    <style>
      .wall{fill:none;stroke:#203832;stroke-width:12;stroke-linejoin:round}.partition{fill:none;stroke:#203832;stroke-width:7}.door{fill:none;stroke:#d56f4b;stroke-width:4}.window{stroke:#d56f4b;stroke-width:9}.label{fill:#203832;font-family:Arial,sans-serif;font-size:24px;letter-spacing:2px}.measure{fill:#66726e;font-family:Arial,sans-serif;font-size:16px;letter-spacing:1px}.furniture{fill:none;stroke:#74817c;stroke-width:3}.accent{fill:#d56f4b}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f7f2e9"/>
  <rect width="1200" height="820" fill="url(#grid)"/>
  <text x="70" y="72" class="label" font-weight="700">OPENHAUS · SAMPLE FLOOR PLAN</text>
  <text x="70" y="104" class="measure">GROUND FLOOR · ILLUSTRATIVE ONLY · NOT FOR CONSTRUCTION</text>
  <path class="wall" d="M120 160H1080V700H120Z"/>
  <path class="partition" d="M450 160V700M450 405H1080M790 405V700M940 405V700"/>
  <path class="partition" d="M120 500H450M275 500V700"/>
  <path class="door" d="M450 330h-72m72 0a72 72 0 0 0-72-72M450 590h-68m68 0a68 68 0 0 0-68-68M790 510h-62m62 0a62 62 0 0 0-62-62M940 510h-62m62 0a62 62 0 0 0-62-62M275 590h-62m62 0a62 62 0 0 0-62-62"/>
  <path class="door" d="M565 700v-72m0 72a72 72 0 0 1 72-72"/>
  <path class="window" d="M200 160h150M610 160h260M1080 225v120M1080 505v115M610 700h115"/>
  <rect x="170" y="235" width="210" height="92" rx="8" class="furniture"/>
  <rect x="190" y="355" width="170" height="60" rx="6" class="furniture"/>
  <rect x="585" y="220" width="260" height="86" rx="8" class="furniture"/>
  <circle cx="715" cy="348" r="34" class="furniture"/>
  <path class="furniture" d="M500 470h230v66H500zM500 560h150v58H500zM830 470h72v180h-72zM980 470h58v180h-58z"/>
  <text x="285" y="455" text-anchor="middle" class="label">LIVING ROOM</text><text x="285" y="479" text-anchor="middle" class="measure">5.4 × 4.8 m</text>
  <text x="715" y="365" text-anchor="middle" class="label">KITCHEN / DINING</text><text x="715" y="389" text-anchor="middle" class="measure">7.2 × 4.8 m</text>
  <text x="197" y="610" text-anchor="middle" class="label">STUDY</text><text x="197" y="634" text-anchor="middle" class="measure">3.1 × 3.0 m</text>
  <text x="360" y="610" text-anchor="middle" class="label">HALL</text><text x="360" y="634" text-anchor="middle" class="measure">ENTRANCE</text>
  <text x="620" y="660" text-anchor="middle" class="label">FAMILY ROOM</text>
  <text x="865" y="660" text-anchor="middle" class="label">UTILITY</text>
  <text x="1010" y="660" text-anchor="middle" class="label">WC</text>
  <path d="M480 748H920" class="window"/><text x="700" y="782" text-anchor="middle" class="measure">GARDEN TERRACE</text>
  <circle cx="1090" cy="92" r="27" fill="none" stroke="#203832" stroke-width="3"/><path d="M1090 50v84M1078 67l12-17 12 17" class="partition" stroke-width="3"/><text x="1090" y="146" text-anchor="middle" class="measure">N</text>
  <circle cx="72" cy="754" r="6" class="accent"/><circle cx="94" cy="754" r="6" class="accent"/><circle cx="116" cy="754" r="6" class="accent"/>
</svg>
